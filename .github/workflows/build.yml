# Digimon World - APK con emulador de PS1 incluido (LibretroDroid + PCSX ReARMed)
# Guarda este archivo en tu repositorio como: .github/workflows/build.yml
# Luego: pestaña Actions > "Build Digimon World APK" > Run workflow.
# El APK aparece en Releases (y como artefacto de la ejecución).
name: Build Digimon World APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

env:
  # ===================== CONFIGURACIÓN (todo fijo aquí) =====================
  # Ruta de tu disco legal (el .cue, o .chd / .pbp / .m3u). Sin comillas dobles dentro.
  DISC_PATH: "/storage/emulated/0/Games/Digimon World (USA).cue"
  # =========================================================================

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generar proyecto Android
        run: |
          mkdir -p p/app/src/main/java/org/elpollopaco/digimonworld p/app/src/main/jniLibs/arm64-v8a
          cd p

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
                  maven("https://jitpack.io")
              }
          }
          rootProject.name = "DigimonWorld"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "org.elpollopaco.digimonworld"
              compileSdk = 34
              defaultConfig {
                  applicationId = "org.elpollopaco.digimonworld"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
                  ndk { abiFilters += "arm64-v8a" }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              packaging { jniLibs { useLegacyPackaging = true } }
          }

          dependencies {
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
              implementation("com.github.Swordfish90:LibretroDroid:0.13.2")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-feature android:glEsVersion="0x00030000" android:required="true" />
              <application
                  android:label="Digimon World"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboardHidden|keyboard|navigation|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/org/elpollopaco/digimonworld/MainActivity.kt <<'EOF'
          package org.elpollopaco.digimonworld

          import android.Manifest
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.provider.Settings
          import android.view.Gravity
          import android.view.HapticFeedbackConstants
          import android.view.InputDevice
          import android.view.KeyEvent
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewGroup
          import android.view.WindowManager
          import android.widget.FrameLayout
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat
          import com.swordfish.libretrodroid.GLRetroView
          import com.swordfish.libretrodroid.GLRetroViewData
          import kotlinx.coroutines.runBlocking
          import java.io.File

          // El valor lo pone el workflow desde DISC_PATH (arriba en build.yml).
          const val DISC_PATH = "__DISC_PATH__"
          const val CORE_LIB = "libpcsx_rearmed_libretro_android.so"

          class PadButton(
              context: Context,
              private val label: String,
              private val keyCode: Int,
              private val send: (Int, Int) -> Unit,
              private val round: Boolean
          ) : View(context) {
              private val fill = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.WHITE }
              private val text = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.WHITE
                  textAlign = Paint.Align.CENTER
                  textSize = 18f * resources.displayMetrics.density
              }
              private var down = false

              override fun onDraw(c: Canvas) {
                  fill.alpha = if (down) 170 else 70
                  val w = width.toFloat()
                  val h = height.toFloat()
                  if (round) c.drawCircle(w / 2, h / 2, minOf(w, h) / 2 - 2f, fill)
                  else c.drawRoundRect(2f, 2f, w - 2f, h - 2f, h / 2, h / 2, fill)
                  c.drawText(label, w / 2, h / 2 - (text.ascent() + text.descent()) / 2, text)
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          down = true
                          performHapticFeedback(HapticFeedbackConstants.VIRTUAL_KEY)
                          send(KeyEvent.ACTION_DOWN, keyCode)
                          invalidate()
                      }
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                          if (down) {
                              down = false
                              send(KeyEvent.ACTION_UP, keyCode)
                              invalidate()
                          }
                      }
                  }
                  return true
              }
          }

          class MainActivity : AppCompatActivity() {
              private var retroView: GLRetroView? = null
              private lateinit var root: FrameLayout
              private var pidioPermiso = false
              private val sramFile by lazy { File(filesDir, "saves/memcard.srm") }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  root = FrameLayout(this)
                  root.setBackgroundColor(Color.BLACK)
                  setContentView(root)
              }

              override fun onResume() {
                  super.onResume()
                  WindowInsetsControllerCompat(window, window.decorView).apply {
                      hide(WindowInsetsCompat.Type.systemBars())
                      systemBarsBehavior =
                          WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                  }
                  if (retroView != null) return
                  if (tieneAcceso()) {
                      iniciarJuego()
                  } else if (!pidioPermiso) {
                      pidioPermiso = true
                      pedirAcceso()
                  }
              }

              override fun onPause() {
                  guardarMemoryCard()
                  super.onPause()
              }

              private fun tieneAcceso(): Boolean =
                  if (Build.VERSION.SDK_INT >= 30) Environment.isExternalStorageManager()
                  else checkSelfPermission(Manifest.permission.READ_EXTERNAL_STORAGE) ==
                      PackageManager.PERMISSION_GRANTED

              private fun pedirAcceso() {
                  if (Build.VERSION.SDK_INT >= 30) {
                      startActivity(
                          Intent(
                              Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION,
                              Uri.parse("package:$packageName")
                          )
                      )
                  } else {
                      requestPermissions(arrayOf(Manifest.permission.READ_EXTERNAL_STORAGE), 1)
                  }
              }

              private fun iniciarJuego() {
                  if (!File(DISC_PATH).exists()) {
                      Toast.makeText(this, "No se encuentra el disco:\n$DISC_PATH", Toast.LENGTH_LONG).show()
                      return
                  }
                  val saves = File(filesDir, "saves").apply { mkdirs() }
                  // BIOS opcional: copia scph1001.bin en Android/data/<app>/files/system
                  val system = File(getExternalFilesDir(null), "system").apply { mkdirs() }

                  val data = GLRetroViewData(this).apply {
                      coreFilePath = CORE_LIB
                      gameFilePath = DISC_PATH
                      systemDirectory = system.absolutePath
                      savesDirectory = saves.absolutePath
                      saveRAMState = if (sramFile.exists()) sramFile.readBytes() else null
                      preferLowLatencyAudio = true
                  }
                  val view = GLRetroView(this, data)
                  lifecycle.addObserver(view)
                  root.addView(
                      view,
                      FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                  )
                  retroView = view
                  crearControles(view)
              }

              private fun guardarMemoryCard() {
                  val v = retroView ?: return
                  try {
                      val bytes = runBlocking { v.serializeSRAM() }
                      sramFile.parentFile?.mkdirs()
                      sramFile.writeBytes(bytes)
                  } catch (e: Exception) {
                      // sin guardado esta vez
                  }
              }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              private fun colocar(
                  view: GLRetroView, label: String, key: Int, w: Int, h: Int,
                  gravity: Int, l: Int, t: Int, r: Int, b: Int, round: Boolean = true
              ) {
                  val boton = PadButton(this, label, key, { a, k -> view.sendKeyEvent(a, k, 0) }, round)
                  val lp = FrameLayout.LayoutParams(dp(w), dp(h), gravity)
                  lp.setMargins(dp(l), dp(t), dp(r), dp(b))
                  root.addView(boton, lp)
              }

              private fun crearControles(v: GLRetroView) {
                  val izqAbajo = Gravity.LEFT or Gravity.BOTTOM
                  val derAbajo = Gravity.RIGHT or Gravity.BOTTOM
                  val izqArriba = Gravity.LEFT or Gravity.TOP
                  val derArriba = Gravity.RIGHT or Gravity.TOP
                  val centroAbajo = Gravity.CENTER_HORIZONTAL or Gravity.BOTTOM

                  // Cruceta
                  colocar(v, "▲", KeyEvent.KEYCODE_DPAD_UP, 56, 56, izqAbajo, 62, 0, 0, 138)
                  colocar(v, "▼", KeyEvent.KEYCODE_DPAD_DOWN, 56, 56, izqAbajo, 62, 0, 0, 26)
                  colocar(v, "◀", KeyEvent.KEYCODE_DPAD_LEFT, 56, 56, izqAbajo, 6, 0, 0, 82)
                  colocar(v, "▶", KeyEvent.KEYCODE_DPAD_RIGHT, 56, 56, izqAbajo, 118, 0, 0, 82)

                  // Botones de acción (por posición: A=abajo=Cruz, B=derecha=Círculo)
                  colocar(v, "△", KeyEvent.KEYCODE_BUTTON_Y, 56, 56, derAbajo, 0, 0, 62, 138)
                  colocar(v, "✕", KeyEvent.KEYCODE_BUTTON_A, 56, 56, derAbajo, 0, 0, 62, 26)
                  colocar(v, "□", KeyEvent.KEYCODE_BUTTON_X, 56, 56, derAbajo, 0, 0, 118, 82)
                  colocar(v, "○", KeyEvent.KEYCODE_BUTTON_B, 56, 56, derAbajo, 0, 0, 6, 82)

                  // Gatillos
                  colocar(v, "L2", KeyEvent.KEYCODE_BUTTON_L2, 64, 40, izqArriba, 16, 16, 0, 0, false)
                  colocar(v, "L1", KeyEvent.KEYCODE_BUTTON_L1, 64, 40, izqArriba, 16, 64, 0, 0, false)
                  colocar(v, "R2", KeyEvent.KEYCODE_BUTTON_R2, 64, 40, derArriba, 0, 16, 16, 0, false)
                  colocar(v, "R1", KeyEvent.KEYCODE_BUTTON_R1, 64, 40, derArriba, 0, 64, 16, 0, false)

                  // Select / Start
                  colocar(v, "SELECT", KeyEvent.KEYCODE_BUTTON_SELECT, 84, 34, centroAbajo, -100, 0, 0, 14, false)
                  colocar(v, "START", KeyEvent.KEYCODE_BUTTON_START, 84, 34, centroAbajo, 100, 0, 0, 14, false)
              }

              // Mandos físicos
              override fun dispatchKeyEvent(event: KeyEvent): Boolean {
                  val v = retroView
                  val esMando = (event.source and InputDevice.SOURCE_GAMEPAD) != 0 ||
                      (event.source and InputDevice.SOURCE_DPAD) != 0
                  if (v != null && esMando && event.keyCode != KeyEvent.KEYCODE_BACK &&
                      (event.action == KeyEvent.ACTION_DOWN || event.action == KeyEvent.ACTION_UP)
                  ) {
                      v.sendKeyEvent(event.action, event.keyCode, 0)
                      return true
                  }
                  return super.dispatchKeyEvent(event)
              }
          }
          EOF

          sed -i "s|__DISC_PATH__|${DISC_PATH}|" app/src/main/java/org/elpollopaco/digimonworld/MainActivity.kt

      - name: Descargar núcleo PCSX ReARMed (arm64)
        run: |
          curl -fL -o core.zip https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/pcsx_rearmed_libretro_android.so.zip
          unzip -o core.zip -d core_tmp
          cp core_tmp/pcsx_rearmed_libretro_android.so p/app/src/main/jniLibs/arm64-v8a/libpcsx_rearmed_libretro_android.so
          ls -l p/app/src/main/jniLibs/arm64-v8a/

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar APK
        working-directory: p
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: digimon-world-apk
          path: p/app/build/outputs/apk/debug/app-debug.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Digimon World APK ${{ github.run_number }}
          files: p/app/build/outputs/apk/debug/app-debug.apk
