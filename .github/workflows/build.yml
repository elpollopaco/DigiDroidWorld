# Digimon World - APK con emulador de PS1 incluido (LibretroDroid + PCSX ReARMed)
# Guarda este archivo en tu repositorio como: .github/workflows/build.yml
# Luego: pestaña Actions > "Build Digimon World APK" > Run workflow.
# El APK aparece en Releases (y como artefacto de la ejecución).
name: Build Digimon World APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

env:
  # ===================== CONFIGURACIÓN (todo fijo aquí) =====================
  # Carpeta donde pones tu disco (sin comillas dobles dentro).
  # Los nombres de archivo NO importan, pero deben ser copias exactas (se verifica el SHA-256):
  #   Digimon World (USA):   .bin + .cue (los dos, en esta carpeta)
  #   Digimon World (Japan): .iso
  DISC_FOLDER: "/storage/emulated/0/Games"
  # Versión de la app: 1.0, 1.1, 1.2, ... (cámbiala en cada actualización)
  APP_VERSION: "1.2"
  # =========================================================================

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generar proyecto Android
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          mkdir -p p/app/src/main/java/org/elpollopaco/digimonworld p/app/src/main/jniLibs/arm64-v8a p/app/src/main/res/drawable
          cd p

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
                  maven("https://jitpack.io")
              }
          }
          rootProject.name = "DigimonWorld"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "org.elpollopaco.digimonworld"
              compileSdk = 34
              defaultConfig {
                  applicationId = "org.elpollopaco.digimonworld"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
                  ndk { abiFilters += "arm64-v8a" }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              packaging { jniLibs { useLegacyPackaging = true } }
          }

          dependencies {
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
              implementation("com.github.Swordfish90:LibretroDroid:0.13.2")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-feature android:glEsVersion="0x00030000" android:required="true" />
              <application
                  android:label="Digimon World"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboardHidden|keyboard|navigation|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/drawable/ic_github.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12" />
          </vector>
          EOF

          cat > app/src/main/java/org/elpollopaco/digimonworld/MainActivity.kt <<'EOF'
          package org.elpollopaco.digimonworld

          import android.Manifest
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.os.Process
          import android.provider.Settings
          import android.view.Gravity
          import android.view.HapticFeedbackConstants
          import android.view.InputDevice
          import android.view.KeyEvent
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewGroup
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.FrameLayout
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.RadioButton
          import android.widget.RadioGroup
          import android.widget.ScrollView
          import android.widget.SeekBar
          import android.widget.TextView
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat
          import com.swordfish.libretrodroid.GLRetroView
          import com.swordfish.libretrodroid.GLRetroViewData
          import com.swordfish.libretrodroid.Variable
          import kotlinx.coroutines.runBlocking
          import java.io.File
          import java.io.FileInputStream
          import java.security.MessageDigest
          import java.util.concurrent.Executors
          import kotlin.math.abs

          // El valor lo pone el workflow desde DISC_FOLDER (arriba en build.yml).
          const val DISC_FOLDER = "__DISC_FOLDER__"

          // SHA-256 de los discos permitidos (los nombres de archivo no importan)
          const val HASH_USA_BIN = "06084490ea0db34099b31495ccba4ec18fb0ff25c7683c508e9d2db93d4495f4"
          const val HASH_USA_CUE = "82b297b9b499fea9c7f361a497b933b7f971394148212eca03e4798ddc0c98d1"
          const val HASH_JP_ISO = "b5ff9ed251bced70c20eb911eab8ac3e5b77d7a140983d3b5dc31decac4837af"
          const val CORE_LIB = "libpcsx_rearmed_libretro_android.so"

          // Valores predeterminados de los ajustes
          const val RES_DEFECTO = 1   // 1x
          const val TAM_DEFECTO = 100 // % tamaño de controles
          const val OPA_DEFECTO = 30  // % opacidad de controles
          const val IDIOMA_DEFECTO = "en" // "en" = inglés, "es" = español

          class Ajustes(ctx: Context) {
              private val p = ctx.getSharedPreferences("ajustes", Context.MODE_PRIVATE)

              var resolucion: Int
                  get() = p.getInt("res", RES_DEFECTO)
                  set(v) { p.edit().putInt("res", v).apply() }

              var tamano: Int
                  get() = p.getInt("tam", TAM_DEFECTO)
                  set(v) { p.edit().putInt("tam", v).apply() }

              var opacidad: Int
                  get() = p.getInt("opa", OPA_DEFECTO)
                  set(v) { p.edit().putInt("opa", v).apply() }

              var idioma: String
                  get() = p.getString("idioma", IDIOMA_DEFECTO) ?: IDIOMA_DEFECTO
                  set(v) { p.edit().putString("idioma", v).apply() }

              var modoGamepad: Boolean
                  get() = p.getBoolean("gamepad", false)
                  set(v) { p.edit().putBoolean("gamepad", v).apply() }

              fun dx(id: Int): Int = p.getInt("dx" + id, 0)
              fun dy(id: Int): Int = p.getInt("dy" + id, 0)
              fun mover(id: Int, dx: Int, dy: Int) {
                  p.edit().putInt("dx" + id, dx).putInt("dy" + id, dy).apply()
              }

              // Restablece resolución y controles. El idioma y el modo gamepad se conservan.
              fun restablecer() {
                  val actual = idioma
                  val gp = modoGamepad
                  p.edit().clear().putString("idioma", actual).putBoolean("gamepad", gp).apply()
              }
          }

          class PadButton(
              context: Context,
              private val label: String,
              val keyCode: Int,
              private val ajustes: Ajustes,
              private val send: (Int, Int) -> Unit,
              private val round: Boolean,
              private val hit: Float
          ) : View(context) {
              var editMode = false
              private val fill = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.WHITE }
              private val text = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.WHITE
                  textAlign = Paint.Align.CENTER
              }
              private val borde = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.YELLOW
                  style = Paint.Style.STROKE
                  strokeWidth = 4f
              }
              private var down = false
              private var ox = 0f
              private var oy = 0f
              private var tx0 = 0f
              private var ty0 = 0f

              // Pulsa o suelta el botón (lo llama la capa de controles)
              fun presionar(estado: Boolean) {
                  if (down == estado) return
                  down = estado
                  send(if (estado) KeyEvent.ACTION_DOWN else KeyEvent.ACTION_UP, keyCode)
                  invalidate()
              }

              // ¿El punto (x, y), en coordenadas de la capa, cae sobre este botón?
              fun contiene(x: Float, y: Float): Boolean {
                  val cx = left + translationX + width / 2f
                  val cy = top + translationY + height / 2f
                  if (round) {
                      val r = minOf(width, height) / 2f * hit
                      val dx = x - cx
                      val dy = y - cy
                      return dx * dx + dy * dy <= r * r
                  }
                  return abs(x - cx) <= width / 2f && abs(y - cy) <= height / 2f
              }

              override fun onDraw(c: Canvas) {
                  val base = ajustes.opacidad * 255 / 100
                  fill.alpha = if (down) minOf(255, base + 100) else base
                  text.alpha = minOf(255, base + 120)
                  text.textSize = 18f * resources.displayMetrics.density * ajustes.tamano / 100f
                  val w = width.toFloat()
                  val h = height.toFloat()
                  if (round) {
                      c.drawCircle(w / 2, h / 2, minOf(w, h) / 2 - 3f, fill)
                      if (editMode) c.drawCircle(w / 2, h / 2, minOf(w, h) / 2 - 3f, borde)
                  } else {
                      c.drawRoundRect(3f, 3f, w - 3f, h - 3f, h / 2, h / 2, fill)
                      if (editMode) c.drawRoundRect(3f, 3f, w - 3f, h - 3f, h / 2, h / 2, borde)
                  }
                  c.drawText(label, w / 2, h / 2 - (text.ascent() + text.descent()) / 2, text)
              }

              // Solo se usa en modo edición (arrastrar). En juego los toques los gestiona CapaControles.
              override fun onTouchEvent(e: MotionEvent): Boolean {
                  if (!editMode) return false
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          ox = e.rawX
                          oy = e.rawY
                          tx0 = translationX
                          ty0 = translationY
                      }
                      MotionEvent.ACTION_MOVE -> {
                          var nx = tx0 + (e.rawX - ox)
                          var ny = ty0 + (e.rawY - oy)
                          val pv = parent as? View
                          if (pv != null) {
                              nx = nx.coerceIn(-left.toFloat(), (pv.width - width - left).toFloat())
                              ny = ny.coerceIn(-top.toFloat(), (pv.height - height - top).toFloat())
                          }
                          translationX = nx
                          translationY = ny
                      }
                      MotionEvent.ACTION_UP -> {
                          val d = resources.displayMetrics.density
                          ajustes.mover(keyCode, (translationX / d).toInt(), (translationY / d).toInt())
                      }
                  }
                  return true
              }
          }

          // Capa que sigue cada dedo: al deslizar de un botón a otro suelta el anterior y pulsa el nuevo.
          // Un mismo dedo puede pulsar dos botones a la vez si toca donde se solapan (diagonales).
          class CapaControles(context: Context) : FrameLayout(context) {
              var edicion: Boolean = false
                  set(v) {
                      if (v) soltarTodos()
                      field = v
                  }
              private val punteros = HashMap<Int, Set<PadButton>>()
              private val conteo = HashMap<PadButton, Int>()

              override fun dispatchTouchEvent(ev: MotionEvent): Boolean {
                  if (edicion) return super.dispatchTouchEvent(ev)
                  when (ev.actionMasked) {
                      MotionEvent.ACTION_DOWN, MotionEvent.ACTION_POINTER_DOWN -> {
                          val i = ev.actionIndex
                          actualizar(ev.getPointerId(i), ev.getX(i), ev.getY(i), true)
                      }
                      MotionEvent.ACTION_MOVE -> {
                          for (i in 0 until ev.pointerCount) {
                              actualizar(ev.getPointerId(i), ev.getX(i), ev.getY(i), false)
                          }
                      }
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_POINTER_UP -> {
                          soltar(ev.getPointerId(ev.actionIndex))
                      }
                      MotionEvent.ACTION_CANCEL -> soltarTodos()
                  }
                  return true
              }

              private fun actualizar(id: Int, x: Float, y: Float, tactil: Boolean) {
                  val nuevos = HashSet<PadButton>()
                  for (i in 0 until childCount) {
                      val b = getChildAt(i) as? PadButton ?: continue
                      if (b.contiene(x, y)) nuevos.add(b)
                  }
                  val antes: Set<PadButton> = punteros[id] ?: emptySet()
                  for (b in antes) {
                      if (b !in nuevos) quitar(b)
                  }
                  for (b in nuevos) {
                      if (b !in antes) poner(b, tactil)
                  }
                  punteros[id] = nuevos
              }

              private fun poner(b: PadButton, haptico: Boolean) {
                  val n = (conteo[b] ?: 0) + 1
                  conteo[b] = n
                  if (n == 1) {
                      if (haptico) performHapticFeedback(HapticFeedbackConstants.VIRTUAL_KEY)
                      b.presionar(true)
                  }
              }

              private fun quitar(b: PadButton) {
                  val n = (conteo[b] ?: 1) - 1
                  if (n <= 0) {
                      conteo.remove(b)
                      b.presionar(false)
                  } else {
                      conteo[b] = n
                  }
              }

              private fun soltar(id: Int) {
                  val antes = punteros.remove(id) ?: return
                  for (b in antes) quitar(b)
              }

              fun soltarTodos() {
                  for (b in conteo.keys.toList()) b.presionar(false)
                  conteo.clear()
                  punteros.clear()
              }
          }

          private class Def(
              val label: String, val key: Int, val w: Int, val h: Int, val g: Int,
              val l: Int, val t: Int, val r: Int, val b: Int, val round: Boolean, val hit: Float
          )

          // Posición predeterminada de cada botón (en dp, a 100 % de tamaño).
          // La cruceta tiene zona de toque ampliada (1.85): entre dos direcciones se pulsan ambas = diagonal.
          private fun definiciones(): List<Def> {
              val ia = Gravity.LEFT or Gravity.BOTTOM
              val da = Gravity.RIGHT or Gravity.BOTTOM
              val iar = Gravity.LEFT or Gravity.TOP
              val dar = Gravity.RIGHT or Gravity.TOP
              val ca = Gravity.CENTER_HORIZONTAL or Gravity.BOTTOM
              return listOf(
                  // Cruceta
                  Def("▲", KeyEvent.KEYCODE_DPAD_UP, 56, 56, ia, 62, 0, 0, 138, true, 1.85f),
                  Def("▼", KeyEvent.KEYCODE_DPAD_DOWN, 56, 56, ia, 62, 0, 0, 26, true, 1.85f),
                  Def("◀", KeyEvent.KEYCODE_DPAD_LEFT, 56, 56, ia, 6, 0, 0, 82, true, 1.85f),
                  Def("▶", KeyEvent.KEYCODE_DPAD_RIGHT, 56, 56, ia, 118, 0, 0, 82, true, 1.85f),
                  // Acción (por posición: A=abajo=Cruz, B=derecha=Círculo)
                  Def("△", KeyEvent.KEYCODE_BUTTON_Y, 56, 56, da, 0, 0, 62, 138, true, 1f),
                  Def("✕", KeyEvent.KEYCODE_BUTTON_A, 56, 56, da, 0, 0, 62, 26, true, 1f),
                  Def("□", KeyEvent.KEYCODE_BUTTON_X, 56, 56, da, 0, 0, 118, 82, true, 1f),
                  Def("○", KeyEvent.KEYCODE_BUTTON_B, 56, 56, da, 0, 0, 6, 82, true, 1f),
                  // Gatillos
                  Def("L2", KeyEvent.KEYCODE_BUTTON_L2, 64, 40, iar, 16, 16, 0, 0, false, 1f),
                  Def("L1", KeyEvent.KEYCODE_BUTTON_L1, 64, 40, iar, 16, 64, 0, 0, false, 1f),
                  Def("R2", KeyEvent.KEYCODE_BUTTON_R2, 64, 40, dar, 0, 16, 16, 0, false, 1f),
                  Def("R1", KeyEvent.KEYCODE_BUTTON_R1, 64, 40, dar, 0, 64, 16, 0, false, 1f),
                  // Select / Start
                  Def("SELECT", KeyEvent.KEYCODE_BUTTON_SELECT, 84, 34, ca, -100, 0, 0, 14, false, 1f),
                  Def("START", KeyEvent.KEYCODE_BUTTON_START, 84, 34, ca, 100, 0, 0, 14, false, 1f)
              )
          }

          class Disco(val ruta: String, val nombre: String)

          // disco != null -> hay un disco válido. binOk/cueOk indican si se encontró cada archivo válido.
          class Resultado(val disco: Disco?, val carpetaOk: Boolean, val binOk: Boolean, val cueOk: Boolean)

          class MainActivity : AppCompatActivity() {
              private lateinit var root: FrameLayout
              private lateinit var ajustes: Ajustes
              private var retroView: GLRetroView? = null
              private var inicio: View? = null
              private var capaControles: CapaControles? = null
              private var engranaje: View? = null
              private var panel: View? = null
              private var barraEdicion: View? = null
              private val botones = mutableListOf<PadButton>()
              private var enviar: (Int, Int) -> Unit = { _, _ -> }
              private var enEdicion = false
              private var resInicial = RES_DEFECTO
              private val sramFile by lazy { File(filesDir, "saves/memcard.srm") }
              private var discoListo: Disco? = null
              private var idEscaneo = 0
              private var cargando = false
              private val ejecutor = Executors.newSingleThreadExecutor()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  ajustes = Ajustes(this)
                  root = FrameLayout(this)
                  root.setBackgroundColor(Color.BLACK)
                  setContentView(root)
              }

              override fun onResume() {
                  super.onResume()
                  WindowInsetsControllerCompat(window, window.decorView).apply {
                      hide(WindowInsetsCompat.Type.systemBars())
                      systemBarsBehavior =
                          WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                  }
                  if (retroView != null || panel != null || enEdicion || cargando) return
                  if (intent.getBooleanExtra("autostart", false) && tieneAcceso()) {
                      intent.removeExtra("autostart")
                      cargando = true
                      ejecutor.execute {
                          val r = escanear { }
                          runOnUiThread {
                              cargando = false
                              if (isFinishing) return@runOnUiThread
                              discoListo = r.disco
                              if (r.disco != null) iniciarJuego() else mostrarInicio()
                          }
                      }
                  } else {
                      mostrarInicio()
                  }
              }

              override fun onPause() {
                  capaControles?.soltarTodos()
                  guardarMemoryCard()
                  super.onPause()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  // El núcleo no se puede cargar dos veces en el mismo proceso: lo cerramos del todo
                  if (retroView != null) Process.killProcess(Process.myPid())
              }

              @Suppress("DEPRECATION")
              override fun onBackPressed() {
                  when {
                      enEdicion -> salirEdicion()
                      panel != null -> cerrarAjustes()
                      else -> super.onBackPressed()
                  }
              }

              // ---------- Utilidades ----------
              private fun dp(v: Number): Int = (v.toFloat() * resources.displayMetrics.density).toInt()

              // Texto según el idioma elegido: tr(inglés, español)
              private fun tr(en: String, es: String): String = if (ajustes.idioma == "es") es else en

              private fun versionApp(): String {
                  return try {
                      packageManager.getPackageInfo(packageName, 0).versionName ?: "?"
                  } catch (e: Exception) {
                      "?"
                  }
              }

              private fun texto(t: String, sp: Float = 16f, negrita: Boolean = false, color: Int = Color.WHITE): TextView {
                  val tv = TextView(this)
                  tv.text = t
                  tv.textSize = sp
                  tv.setTextColor(color)
                  tv.gravity = Gravity.CENTER
                  tv.setPadding(0, dp(6), 0, dp(6))
                  if (negrita) tv.setTypeface(null, Typeface.BOLD)
                  return tv
              }

              private fun boton(t: String, accion: () -> Unit): Button {
                  val b = Button(this)
                  b.text = t
                  b.isAllCaps = false
                  b.setOnClickListener { accion() }
                  b.layoutParams = LinearLayout.LayoutParams(dp(260), ViewGroup.LayoutParams.WRAP_CONTENT)
                  return b
              }

              private fun cambio(f: (Int) -> Unit) = object : SeekBar.OnSeekBarChangeListener {
                  override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) {
                      if (fromUser) f(p)
                  }
                  override fun onStartTrackingTouch(s: SeekBar?) {}
                  override fun onStopTrackingTouch(s: SeekBar?) {}
              }

              private fun traerAlFrente() {
                  engranaje?.bringToFront()
                  panel?.bringToFront()
                  barraEdicion?.bringToFront()
              }

              // ---------- Permisos y disco ----------
              private fun tieneAcceso(): Boolean =
                  if (Build.VERSION.SDK_INT >= 30) Environment.isExternalStorageManager()
                  else checkSelfPermission(Manifest.permission.READ_EXTERNAL_STORAGE) ==
                      PackageManager.PERMISSION_GRANTED

              private fun pedirAcceso() {
                  if (Build.VERSION.SDK_INT >= 30) {
                      startActivity(
                          Intent(
                              Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION,
                              Uri.parse("package:" + packageName)
                          )
                      )
                  } else {
                      requestPermissions(arrayOf(Manifest.permission.READ_EXTERNAL_STORAGE), 1)
                  }
              }

              // ---------- Verificación del disco (SHA-256) ----------
              private fun sha256(f: File, avance: (String) -> Unit): String {
                  val prefs = getSharedPreferences("hashes", Context.MODE_PRIVATE)
                  val clave = "h:" + f.absolutePath + "|" + f.length() + "|" + f.lastModified()
                  val guardado = prefs.getString(clave, null)
                  if (guardado != null) return guardado
                  val md = MessageDigest.getInstance("SHA-256")
                  val total = f.length()
                  var leidos = 0L
                  var ultimo = -1
                  val buf = ByteArray(1 shl 20)
                  FileInputStream(f).use { ins ->
                      while (true) {
                          val n = ins.read(buf)
                          if (n < 0) break
                          md.update(buf, 0, n)
                          leidos += n
                          if (total > 1000000L) {
                              val p = (leidos * 100 / total).toInt()
                              if (p != ultimo) {
                                  ultimo = p
                                  avance(tr("Verifying ", "Verificando ") + f.name + "  " + p + "%")
                              }
                          }
                      }
                  }
                  val hex = md.digest().joinToString("") { "%02x".format(it) }
                  prefs.edit().putString(clave, hex).apply()
                  return hex
              }

              // Si el .cue apunta a otro nombre de .bin, crea un .cue temporal junto al .bin con el nombre real
              private fun prepararCue(cue: File, bin: File): String? {
                  return try {
                      val contenido = cue.readText(Charsets.ISO_8859_1)
                      val re = Regex("(?i)(FILE\\s+)(\"[^\"]*\"|\\S+)(\\s+BINARY)")
                      val m = re.find(contenido) ?: return cue.absolutePath
                      val ref = m.groupValues[2].trim('"')
                      if (ref == bin.name) return cue.absolutePath
                      val nuevo = contenido.replaceFirst(
                          re,
                          Regex.escapeReplacement(m.groupValues[1] + "\"" + bin.name + "\"" + m.groupValues[3])
                      )
                      val tmp = File(bin.parentFile, ".digimon_runtime.cue")
                      tmp.writeText(nuevo, Charsets.ISO_8859_1)
                      tmp.absolutePath
                  } catch (e: Exception) {
                      null
                  }
              }

              // Busca en la carpeta un disco válido, sin importar los nombres de archivo
              private fun escanear(avance: (String) -> Unit): Resultado {
                  val carpeta = File(DISC_FOLDER)
                  try {
                      val todos = carpeta.listFiles()
                      if (!carpeta.isDirectory || todos == null) return Resultado(null, false, false, false)
                      val archivos = todos.filter { it.isFile }.sortedBy { it.name.lowercase() }
                      val cues = archivos.filter { it.extension.lowercase() == "cue" }
                      val isos = archivos.filter { it.extension.lowercase() == "iso" }
                      val bins = archivos.filter { it.extension.lowercase() == "bin" }

                      var cueValido: File? = null
                      for (f in cues) {
                          if (sha256(f, avance) == HASH_USA_CUE) {
                              cueValido = f
                              break
                          }
                      }
                      for (f in isos) {
                          if (sha256(f, avance) == HASH_JP_ISO) {
                              return Resultado(
                                  Disco(f.absolutePath, "Digimon World (Japan) - " + f.name),
                                  true, false, cueValido != null
                              )
                          }
                      }
                      var binValido: File? = null
                      for (f in bins) {
                          if (sha256(f, avance) == HASH_USA_BIN) {
                              binValido = f
                              break
                          }
                      }
                      if (binValido != null && cueValido != null) {
                          val ruta = prepararCue(cueValido, binValido)
                          if (ruta != null) {
                              return Resultado(
                                  Disco(ruta, "Digimon World (USA) - " + binValido.name),
                                  true, true, true
                              )
                          }
                      }
                      return Resultado(null, true, binValido != null, cueValido != null)
                  } catch (e: Exception) {
                      return Resultado(null, carpeta.isDirectory, false, false)
                  }
              }

