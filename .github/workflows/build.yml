              // Verifica los archivos en segundo plano y muestra el resultado en la zona central
              private fun verificarDisco(zona: LinearLayout) {
                  val id = ++idEscaneo
                  discoListo = null
                  val prog = texto(
                      tr("Verifying disc files…", "Verificando archivos del disco…"),
                      15f, false, Color.LTGRAY
                  )
                  zona.addView(prog)
                  ejecutor.execute {
                      val r = escanear { msg -> runOnUiThread { if (id == idEscaneo) prog.text = msg } }
                      runOnUiThread {
                          if (id == idEscaneo && !isFinishing) {
                              discoListo = r.disco
                              zona.removeAllViews()
                              mostrarResultado(zona, r)
                          }
                      }
                  }
              }

              private fun mostrarResultado(zona: LinearLayout, r: Resultado) {
                  val d = r.disco
                  if (d != null) {
                      zona.addView(texto(tr("Valid disc found:", "Disco válido encontrado:") + "\n" + d.nombre))
                      zona.addView(boton(tr("▶  Start", "▶  Iniciar")) { iniciarJuego() })
                      return
                  }
                  if (!r.carpetaOk) {
                      zona.addView(texto(tr("Folder not found:", "No se encontró la carpeta:")))
                  } else {
                      zona.addView(texto(tr("No valid disc found in:", "No se encontró un disco válido en:")))
                  }
                  zona.addView(texto(DISC_FOLDER, 15f, false, Color.YELLOW))
                  if (r.binOk && !r.cueOk) {
                      zona.addView(
                          texto(
                              tr(
                                  "The .bin is valid, but the matching .cue is missing.",
                                  "El .bin es válido, pero falta el .cue correspondiente."
                              ), 14f, false, Color.CYAN
                          )
                      )
                  }
                  if (r.cueOk && !r.binOk) {
                      zona.addView(
                          texto(
                              tr(
                                  "The .cue is valid, but the matching .bin is missing.",
                                  "El .cue es válido, pero falta el .bin correspondiente."
                              ), 14f, false, Color.CYAN
                          )
                      )
                  }
                  zona.addView(
                      texto(
                          tr(
                              "Accepted discs (file names don't matter, but they must be the exact originals):\n" +
                                  "• Digimon World (USA): .bin + .cue, both in this folder\n" +
                                  "• Digimon World (Japan): .iso",
                              "Discos aceptados (los nombres no importan, pero deben ser los archivos originales exactos):\n" +
                                  "• Digimon World (USA): .bin + .cue, ambos en esta carpeta\n" +
                                  "• Digimon World (Japan): .iso"
                          ), 13f, false, Color.LTGRAY
                      )
                  )
                  zona.addView(boton(tr("Check again", "Comprobar de nuevo")) { mostrarInicio() })
              }

              private fun textoGamepad(): String {
                  val estado = if (ajustes.modoGamepad) tr("On", "Activado") else tr("Off", "Desactivado")
                  return "🎮  " + tr("Gamepad mode: ", "Modo Gamepad: ") + estado
              }

              private fun abrirGitHub() {
                  try {
                      startActivity(
                          Intent(Intent.ACTION_VIEW, Uri.parse("https://github.com/elpollopaco/DigiDroidWorld"))
                      )
                  } catch (e: Exception) {
                      // sin navegador disponible
                  }
              }

              private fun elegirIdioma() {
                  AlertDialog.Builder(this)
                      .setTitle(tr("Language", "Idioma"))
                      .setItems(arrayOf("English", "Español")) { _, cual ->
                          ajustes.idioma = if (cual == 1) "es" else "en"
                          mostrarInicio()
                      }
                      .show()
              }

              // ---------- Juego ----------
              private fun iniciarJuego() {
                  if (retroView != null) return
                  val disco = discoListo
                  if (disco == null) {
                      mostrarInicio()
                      return
                  }
                  inicio?.let { root.removeView(it) }
                  inicio = null
                  quitarControles()

                  val saves = File(filesDir, "saves").apply { mkdirs() }
                  // BIOS opcional: copia scph1001.bin en Android/data/<app>/files/system
                  val system = File(getExternalFilesDir(null), "system").apply { mkdirs() }
                  val enhanced = if (ajustes.resolucion >= 2) "enabled" else "disabled"

                  val data = GLRetroViewData(this).apply {
                      coreFilePath = CORE_LIB
                      gameFilePath = disco.ruta
                      systemDirectory = system.absolutePath
                      savesDirectory = saves.absolutePath
                      saveRAMState = if (sramFile.exists()) sramFile.readBytes() else null
                      preferLowLatencyAudio = true
                      variables = arrayOf(Variable("pcsx_rearmed_neon_enhancement_enable", enhanced))
                  }
                  val view = GLRetroView(this, data)
                  lifecycle.addObserver(view)
                  root.addView(
                      view,
                      FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                  )
                  retroView = view
                  enviar = { a, k -> view.sendKeyEvent(a, k, 0) }
                  construirControles(false)
                  crearEngranaje()
              }

              private fun guardarMemoryCard() {
                  val v = retroView ?: return
                  try {
                      val bytes = runBlocking { v.serializeSRAM() }
                      sramFile.parentFile?.mkdirs()
                      sramFile.writeBytes(bytes)
                  } catch (e: Exception) {
                      // sin guardado esta vez
                  }
              }

              private fun reiniciarApp() {
                  capaControles?.soltarTodos()
                  guardarMemoryCard()
                  val i = packageManager.getLaunchIntentForPackage(packageName)
                  if (i != null) {
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TASK)
                      i.putExtra("autostart", true)
                      startActivity(i)
                  }
                  Process.killProcess(Process.myPid())
              }

              private fun crearEngranaje() {
                  val g = TextView(this)
                  g.text = "⚙"
                  g.textSize = 22f
                  g.setTextColor(Color.WHITE)
                  g.gravity = Gravity.CENTER
                  g.alpha = 0.55f
                  g.setBackgroundColor(Color.argb(60, 255, 255, 255))
                  g.setOnClickListener { mostrarAjustes() }
                  val lp = FrameLayout.LayoutParams(dp(44), dp(44), Gravity.TOP or Gravity.CENTER_HORIZONTAL)
                  lp.topMargin = dp(6)
                  root.addView(g, lp)
                  engranaje = g
                  traerAlFrente()
              }

              // ---------- Controles ----------
              private fun construirControles(editar: Boolean) {
                  quitarControles()
                  if (ajustes.modoGamepad) return // Modo Gamepad: sin controles táctiles
                  val capa = CapaControles(this)
                  capa.edicion = editar
                  capaControles = capa
                  root.addView(
                      capa,
                      FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                  )
                  val e = ajustes.tamano / 100f
                  val d = resources.displayMetrics.density
                  for (c in definiciones()) {
                      val b = PadButton(this, c.label, c.key, ajustes, { a, k -> enviar(a, k) }, c.round, c.hit)
                      b.editMode = editar
                      val lp = FrameLayout.LayoutParams(dp(c.w * e), dp(c.h * e), c.g)
                      lp.setMargins(dp(c.l * e), dp(c.t * e), dp(c.r * e), dp(c.b * e))
                      b.translationX = ajustes.dx(c.key) * d
                      b.translationY = ajustes.dy(c.key) * d
                      capa.addView(b, lp)
                      botones.add(b)
                  }
                  traerAlFrente()
              }

              private fun quitarControles() {
                  capaControles?.soltarTodos()
                  capaControles?.let { root.removeView(it) }
                  capaControles = null
                  botones.clear()
              }

              // ---------- Ajustes ----------
              private fun mostrarAjustes(nuevo: Boolean = true) {
                  if (panel != null) return
                  if (nuevo) resInicial = ajustes.resolucion
                  val enJuego = retroView != null
                  inicio?.visibility = View.INVISIBLE
                  if (!enJuego && capaControles == null) construirControles(false)

                  val scroll = ScrollView(this)
                  scroll.setBackgroundColor(Color.argb(225, 12, 12, 24))
                  val col = LinearLayout(this)
                  col.orientation = LinearLayout.VERTICAL
                  col.setPadding(dp(20), dp(12), dp(20), dp(12))
                  scroll.addView(col)

                  col.addView(texto(tr("Settings", "Ajustes"), 22f, true))

                  // Resolución
                  col.addView(texto(tr("Resolution", "Resolución"), 16f, true))
                  val grupo = RadioGroup(this)
                  grupo.orientation = RadioGroup.HORIZONTAL
                  grupo.gravity = Gravity.CENTER
                  val r1 = RadioButton(this)
                  r1.id = View.generateViewId()
                  r1.text = tr("1x (default)", "1x (predeterminada)")
                  val r2 = RadioButton(this)
                  r2.id = View.generateViewId()
                  r2.text = "2x"
                  grupo.addView(r1)
                  grupo.addView(r2)
                  grupo.check(if (ajustes.resolucion >= 2) r2.id else r1.id)
                  grupo.setOnCheckedChangeListener { _, id -> ajustes.resolucion = if (id == r2.id) 2 else 1 }
                  col.addView(grupo)
                  if (enJuego) {
                      col.addView(
                          texto(
                              tr("Changing the resolution restarts the game.", "Cambiar la resolución reinicia el juego."),
                              13f, false, Color.LTGRAY
                          )
                      )
                  }

                  if (ajustes.modoGamepad) {
                      col.addView(
                          texto(
                              tr(
                                  "Gamepad mode is ON: touch controls are hidden.",
                                  "Modo Gamepad activado: los controles táctiles están ocultos."
                              ), 14f, false, Color.LTGRAY
                          )
                      )
                  } else {
                      // Controles
                      col.addView(texto(tr("Controls", "Controles"), 16f, true))
                      val tamTxt = texto(tr("Size: ", "Tamaño: ") + ajustes.tamano + "%", 14f)
                      col.addView(tamTxt)
                      val tam = SeekBar(this)
                      tam.max = 100
                      tam.progress = ajustes.tamano - 50
                      tam.setOnSeekBarChangeListener(cambio { p ->
                          ajustes.tamano = p + 50
                          tamTxt.text = tr("Size: ", "Tamaño: ") + ajustes.tamano + "%"
                          construirControles(enEdicion)
                      })
                      col.addView(tam)

                      val opaTxt = texto(tr("Opacity: ", "Opacidad: ") + ajustes.opacidad + "%", 14f)
                      col.addView(opaTxt)
                      val opa = SeekBar(this)
                      opa.max = 90
                      opa.progress = ajustes.opacidad - 10
                      opa.setOnSeekBarChangeListener(cambio { p ->
                          ajustes.opacidad = p + 10
                          opaTxt.text = tr("Opacity: ", "Opacidad: ") + ajustes.opacidad + "%"
                          botones.forEach { it.invalidate() }
                      })
                      col.addView(opa)

                      col.addView(boton(tr("Move controls", "Mover controles")) { entrarEdicion() })
                  }
                  col.addView(boton(tr("Reset all", "Restablecer todo")) {
                      ajustes.restablecer()
                      cerrarPanel()
                      construirControles(false)
                      mostrarAjustes(false)
                  })
                  col.addView(boton(tr("Close", "Cerrar")) { cerrarAjustes() })

                  root.addView(
                      scroll,
                      FrameLayout.LayoutParams(
                          dp(380),
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          Gravity.CENTER_HORIZONTAL
                      )
                  )
                  panel = scroll
                  traerAlFrente()
              }

              private fun cerrarPanel() {
                  panel?.let { root.removeView(it) }
                  panel = null
              }

              private fun cerrarAjustes() {
                  cerrarPanel()
                  inicio?.visibility = View.VISIBLE
                  if (retroView == null) {
                      quitarControles()
                      return
                  }
                  if (ajustes.resolucion != resInicial) {
                      AlertDialog.Builder(this)
                          .setTitle(tr("Change resolution", "Cambiar resolución"))
                          .setMessage(
                              tr(
                                  "The game will restart and any progress you haven't saved in the game will be lost. Continue?",
                                  "El juego se reiniciará y se perderá el progreso que no hayas guardado dentro del juego. ¿Continuar?"
                              )
                          )
                          .setPositiveButton(tr("Restart", "Reiniciar")) { _, _ -> reiniciarApp() }
                          .setNegativeButton(tr("Cancel", "Cancelar")) { _, _ -> ajustes.resolucion = resInicial }
                          .setCancelable(false)
                          .show()
                  }
              }

              private fun entrarEdicion() {
                  cerrarPanel()
                  enEdicion = true
                  capaControles?.edicion = true
                  engranaje?.visibility = View.GONE
                  botones.forEach {
                      it.editMode = true
                      it.invalidate()
                  }
                  val barra = LinearLayout(this)
                  barra.orientation = LinearLayout.HORIZONTAL
                  barra.gravity = Gravity.CENTER
                  barra.setBackgroundColor(Color.argb(200, 0, 0, 0))
                  barra.setPadding(dp(12), dp(6), dp(12), dp(6))
                  barra.addView(texto(tr("Drag the buttons to move them", "Arrastra los botones para moverlos"), 14f))
                  val listo = boton(tr("Done", "Listo")) { salirEdicion() }
                  listo.layoutParams = LinearLayout.LayoutParams(dp(110), ViewGroup.LayoutParams.WRAP_CONTENT)
                  barra.addView(listo)
                  root.addView(
                      barra,
                      FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          Gravity.TOP or Gravity.CENTER_HORIZONTAL
                      )
                  )
                  barraEdicion = barra
                  traerAlFrente()
              }

              private fun salirEdicion() {
                  barraEdicion?.let { root.removeView(it) }
                  barraEdicion = null
                  enEdicion = false
                  capaControles?.edicion = false
                  engranaje?.visibility = View.VISIBLE
                  botones.forEach {
                      it.editMode = false
                      it.invalidate()
                  }
                  mostrarAjustes(false)
              }

              // Mandos físicos
              override fun dispatchKeyEvent(event: KeyEvent): Boolean {
                  val v = retroView
                  val esMando = (event.source and InputDevice.SOURCE_GAMEPAD) != 0 ||
                      (event.source and InputDevice.SOURCE_DPAD) != 0
                  if (v != null && esMando && event.keyCode != KeyEvent.KEYCODE_BACK &&
                      (event.action == KeyEvent.ACTION_DOWN || event.action == KeyEvent.ACTION_UP)
                  ) {
                      v.sendKeyEvent(event.action, event.keyCode, 0)
                      return true
                  }
                  return super.dispatchKeyEvent(event)
              }
          }
